services:
  postgres:
    image: postgres:16-alpine
    container_name: nutribyte-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nutribyte
    ports:
      - "5432:5432"
    volumes:
      - nutribyte_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nutribyte"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: nutribyte-redis
    ports:
      - "6379:6379"
    volumes:
      - nutribyte_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  nutribyte_pgdata:
  nutribyte_redisdata:
